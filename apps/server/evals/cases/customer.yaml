- id: cq-stock-price
  category: customer questions
  actor: customer
  channel: messenger
  input: Maroon kurti XL ache? dam koto?
  expect:
    reply: { containsAny: ['1,250', '1250', '১,২৫০', '১২৫০'] }
    held: false

- id: cq-delivery-ctg
  category: customer questions
  actor: customer
  input: Chittagong e delivery charge koto? koto din lage?
  expect:
    reply: { containsAny: ['120', '১২০'] }
    held: false

- id: cq-bangla
  category: customer questions
  actor: customer
  input: জার্সি হিজাব কি কি রঙে আছে?
