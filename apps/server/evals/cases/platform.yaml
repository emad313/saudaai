- id: store-order-on-confirm
  category: connected store
  actor: seller
  inputKind: voice
  setup: { store: true, auto: { send_order_confirmation: true } }
  input: Rahim bhai 2 ta maroon kurti nibe M size, Mirpur 10, bkash e pay korbe
  expect:
    order:
      {
        items: [Maroon Block Print Kurti/M x2],
        paymentMethod: bkash,
        customer: Rahim Uddin,
        status: confirmed,
      }
    storeOrders: 1

- id: store-live-price
  category: connected store
  actor: seller
  setup:
    store: true
    storeChange: { variant: Maroon Block Print Kurti/L, taka: 1350 }
  input: Rahim Uddin er jonno 1 ta maroon kurti L size order koro, Mirpur 10, cash on delivery
  expect:
    order: { items: [Maroon Block Print Kurti/L x1], subtotalTaka: 1350, status: draft }
    storeOrders: 0

- id: store-sold-out-since-sync
  category: connected store
  actor: customer
  setup:
    store: true
    storeChange: { variant: Navy Embroidered Kurti/M, stock: 0 }
  history:
    - { role: customer, text: navy kurti M size ache? }
    - { role: agent, text: 'Ji, Navy Embroidered Kurti M size ache, dam ৳1,450.' }
  input: 'thik ache 1 ta nibo. Mitu, 01755123456, House 4 Road 2 Uttara, Uttara, cash on delivery'
  expect:
    noOrder: true
    storeOrders: 0
    noOffer: true

- id: analytics-by-voice
  category: analytics
  actor: seller
  inputKind: voice
  input: ei soptahe kon product sobcheye beshi bikri holo ar kon channel theke beshi order aslo?
  expect:
    calls: [analytics]

- id: widget-product-context
  category: website widget
  actor: customer
  setup: { viewing: Navy Embroidered Kurti }
  input: eta XL size ache? dam koto?
  expect:
    reply: { containsAny: ['1,450', '1450', '১,৪৫০', '১৪৫০'] }
    held: false

- id: instagram-question
  category: instagram
  actor: customer
  channel: instagram
  input: kalo t-shirt L size ache? dam koto?
  expect:
    reply: { containsAny: ['450', '৪৫০'] }
    held: false

- id: store-photo-to-customer
  category: connected store
  actor: customer
  setup: { store: true }
  input: navy kurti tar chobi dekhan please
  expect:
    calls: [send_product_photo]
    sentImages: 1

- id: banner-to-website
  category: promotion
  actor: seller
  setup: { store: true }
  input: Maroon kurti er eid offer banner banao, 10% off, ar website e diye dao
  expect:
    calls: [make_ad]
    pending: [post_to_website]
    noOrder: true

- id: ad-to-facebook-page
  category: promotion
  actor: seller
  input: Jersey hijab er ekta ad baniye amader facebook page e post koro
  expect:
    calls: [make_ad]
    pending: [post_to_page]
    noOrder: true

- id: image-not-in-store
  category: promotion
  actor: seller
  input: ekta kurti er sundor poster image banao, store theke na, tumi nije baniye dao
  expect:
    calls: [make_image]
    noPending: true
    noProduct: true
    noOrder: true

- id: image-like-reference
  category: promotion
  actor: seller
  setup: { photo: true }
  input: '[sent a photo mediaId={{media}}; as a product photo the cleaned image is mediaId={{media}}; looks like: red sale banner with a woman in a saree; suggested name "Sale Banner"; aliases []] eta moto ekta banner banao amader Jersey hijab diye, facebook page e post koro'
  expect:
    calls: [make_image]
    pending: [post_to_page]
    noProduct: true
    noOrder: true
